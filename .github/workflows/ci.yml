name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Check for committed credentials
        run: python scripts/check_secrets.py
      - name: Run API and source tests
        run: python -m unittest discover -s tests -v
      - name: Validate frontend JavaScript
        run: node --check frontend/app.js
